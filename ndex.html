
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Security Lab Demo</title>
<style>
body {
  margin: 0;
  background: #232428;
  color: white;
  font-family: Arial, sans-serif;
  display: grid;
  place-items: center;
  min-height: 100vh;
}
main {
  background: #313338;
  padding: 28px;
  border-radius: 12px;
  width: 300px;
}
input, button {
  box-sizing: border-box;
  width: 100%;
  padding: 12px;
  margin-top: 12px;
  border: 0;
  border-radius: 6px;
}
input { background: #1e1f22; color: white; }
button { background: #5865f2; color: white; cursor: pointer; }
.note { color: #f0d58c; font-size: 13px; }
</style>
</head>
<body>
<main>
  <h2>Security Lab</h2>
  <p>Login form security demonstration</p>
  <p class="note">Use sample data only. Nothing is saved or sent.</p>
  <form id="demo">
    <input placeholder="Demo username" required>
    <input type="password" placeholder="Fake test password" required>
    <button>Run Demo</button>
  </form>
  <p id="result"></p>
</main>
<script>
document.getElementById("demo").addEventListener("submit", function(e) {
  e.preventDefault();
  this.reset();
  document.getElementById("result").textContent =
    "Demo complete. No credentials were saved or sent.";
});
</script>
</body>
</html>
